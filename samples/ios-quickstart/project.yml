# Generates VisualizeQuickstart.xcodeproj. Run `xcodegen` in this folder,
# then open the project. XcodeGen keeps the sample as readable text.
name: VisualizeQuickstart
options:
  # Change to your own reverse-DNS prefix. The full bundle ID must match the
  # app you register in the portal, or attestation refuses your scans.
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  VisualizeSDK:
    # Depends on the SDK package. The sibling package in this repo is the binary SDK;
    # see the repo root Package.swift.
    path: "../.."
targets:
  VisualizeQuickstart:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: VisualizeSDK
        product: VisualizeSDK
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Quickstart
        UILaunchScreen: {}
        # Portrait-only, iPhone-only: capture uses the front TrueDepth camera.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # HTTPS-only crypto — exempt; skips the export-compliance hold.
        ITSAppUsesNonExemptEncryption: false
        # Required — capture uses the front TrueDepth camera.
        NSCameraUsageDescription: Scanning uses the front camera to measure your body.
        # Your publishable key from the portal. Keep it out of source via an
        # xcconfig ($(VZ_PUBLISHABLE_KEY)) for anything beyond a sample.
        VZPublishableKey: pk_test_replace_me
        # Optional: point at a specific API. Absent = production.
        # VZAPIBaseURL: https://api.visualizeme.ai
    settings:
      base:
        # Set your Apple Development Team (or pick it in Xcode's Signing tab).
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
